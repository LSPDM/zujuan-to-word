name: build-and-deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建单文件工具
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build dist
        run: python build_tool.py

      - name: 检查提交的产物是否与源码一致
        run: |
          if ! git diff --quiet -- dist; then
            echo "::warning title=dist 已过期::仓库中的 dist/ 与 src/ 不一致，已使用本次构建结果。请本地运行 python build_tool.py 后提交 dist/。"
          fi

      - name: 校验产物是单文件（无外链）
        run: |
          f="dist/index.html"
          test -s "$f" || (echo "产物为空" && exit 1)
          if grep -Eq '<script[^>]+src=|<link[^>]+href=' "$f"; then
            echo "::error::产物中出现了外部脚本/样式引用"; exit 1
          fi
          echo "产物大小：$(wc -c < "$f") 字节"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: 附加到 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - name: 解包产物
        run: |
          cd artifact
          tar -xf artifact.tar
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: artifact/index.html
          generate_release_notes: true
